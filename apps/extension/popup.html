<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrawlix</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="masthead">
        <div>
          <p class="wordmark">scrawlix<span aria-hidden="true">*</span></p>
          <p class="tagline">programmable censorship</p>
          <span id="settings-status" class="save-status" aria-live="polite"></span>
        </div>
        <label class="switch-row compact">
          <span>active</span>
          <input id="active" type="checkbox" />
        </label>
      </header>

      <section class="site-card" aria-labelledby="site-heading">
        <div>
          <p class="eyebrow">this site</p>
          <h1 id="site-heading">Loading…</h1>
          <p id="effective-status" class="status-line"></p>
        </div>
        <label>
          <span class="sr-only">Site mode</span>
          <select id="site-mode">
            <option value="inherit">default</option>
            <option value="on">always on</option>
            <option value="off">always off</option>
          </select>
        </label>
      </section>

      <section class="peek-card" aria-label="Temporary reveal">
        <button id="reveal-page" type="button">reveal page · 10s</button>
        <p class="peek-meta">
          <kbd id="reveal-shortcut"></kbd>
          <span id="reveal-status" aria-live="polite"></span>
        </p>
      </section>

      <section class="access-card" aria-label="Browser access">
        <div>
          <p class="eyebrow">browser access</p>
          <p id="access-status" class="access-status">checking…</p>
        </div>
        <div class="access-actions">
          <button id="site-access" type="button">allow this site</button>
          <button id="all-sites-access" type="button">allow all websites</button>
        </div>
      </section>

      <section class="settings-grid" aria-label="Censor treatment">
        <label>
          <span>default sites</span>
          <select id="default-enabled">
            <option value="on">on</option>
            <option value="off">off</option>
          </select>
        </label>

        <label>
          <span>censor style</span>
          <select id="appearance">
            <option value="scrawl">scrawl</option>
            <option value="bar">bar</option>
            <option value="blur">blur</option>
            <option value="asterisk">asterisk</option>
            <option value="grawlix">grawlix</option>
          </select>
        </label>

        <label>
          <span>how much to hide</span>
          <select id="coverage">
            <option value="middle">middle</option>
            <option value="vowel">vowels</option>
            <option value="inner">inner letters</option>
            <option value="tail">after first letter</option>
            <option value="full">whole word</option>
          </select>
        </label>

        <label>
          <span>reveal</span>
          <select id="reveal">
            <option value="hover">hover</option>
            <option value="focus">focus</option>
            <option value="click">click</option>
            <option value="never">hidden</option>
          </select>
        </label>
      </section>

      <section class="custom-words" aria-labelledby="custom-heading">
        <div class="section-label">
          <div>
            <p class="eyebrow">your list</p>
            <h2 id="custom-heading">Custom words & phrases</h2>
          </div>
          <span id="save-status" class="save-status" aria-live="polite"></span>
        </div>
        <textarea
          id="custom-words"
          rows="5"
          placeholder="Project Velvet&#10;Mothbit&#10;spoiler phrase"
          spellcheck="false"
        ></textarea>
        <p class="hint">One per line. Saved locally in this browser.</p>
      </section>

      <footer>
        <span>Scrawlix dev build</span>
        <a href="https://github.com/teamleaderleo/scrawlix" target="_blank" rel="noreferrer">source ↗</a>
      </footer>
    </main>

    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
