<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrawlix</title>
  </head>
  <body>
    <main class="popup-shell">
      <header class="masthead">
        <p class="wordmark">scrawlix<span aria-hidden="true">*</span></p>
        <span id="save-status" class="save-status" aria-live="polite"></span>
        <label class="switch-row">
          <span>active</span>
          <input id="active" type="checkbox" />
        </label>
      </header>

      <section class="site-card" aria-labelledby="site-heading">
        <div>
          <h1 id="site-heading">Loading…</h1>
          <p id="effective-status" class="status-line"></p>
        </div>
        <label>
          <span class="sr-only">Site policy</span>
          <select id="site-mode">
            <option value="inherit">use default</option>
            <option value="on">always on</option>
            <option value="off">always off</option>
          </select>
        </label>
      </section>

      <section class="access-card" aria-label="Website access">
        <div>
          <p id="access-status" class="compact-copy">Checking Chrome access…</p>
        </div>
        <div class="button-row">
          <button id="site-access" type="button">allow this site</button>
          <button id="all-sites-access" type="button" class="quiet">allow all websites</button>
        </div>
      </section>

      <section class="reveal-card" aria-label="Temporary reveal">
        <button id="reveal-page" type="button">reveal page · 10s</button>
        <p class="reveal-meta"><kbd id="reveal-shortcut"></kbd><span id="reveal-status" aria-live="polite"></span></p>
      </section>

      <section class="profile-card" aria-labelledby="profile-heading">
        <h2 id="profile-heading" class="sr-only">Treatment</h2>
        <label class="profile-select"><span>profile</span><select id="profile" aria-label="Active profile"></select></label>
        <div class="settings-grid">
          <label><span>style</span><select id="appearance"><option value="scrawl">scrawl</option><option value="bar">bar</option><option value="blur">blur</option></select></label>
          <label><span>coverage</span><select id="coverage"><option value="middle">middle</option><option value="vowel">vowels</option><option value="inner">inner</option><option value="tail">tail</option><option value="full">full</option></select></label>
          <label><span>reveal</span><select id="reveal"><option value="hover">hover</option><option value="click">click</option><option value="never">hidden</option></select></label>
        </div>
      </section>

      <section class="manage-card" aria-label="Manage Scrawlix">
        <p><strong id="custom-count">0</strong> terms · <strong id="site-exception-count">0</strong> exceptions</p>
        <button id="open-options" type="button">settings…</button>
      </section>

      <footer><span id="version"></span><a href="https://github.com/teamleaderleo/scrawlix" target="_blank" rel="noreferrer">source ↗</a></footer>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
