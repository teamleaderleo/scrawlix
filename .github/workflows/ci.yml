name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Store package smoke
        run: |
          pnpm --filter scrawlix-extension package:store -- --version 0.0.1
          first_sha="$(cut -d' ' -f1 apps/extension/release/scrawlix-extension-0.0.1.sha256)"
          pnpm --filter scrawlix-extension package:store -- --version 0.0.1
          second_sha="$(cut -d' ' -f1 apps/extension/release/scrawlix-extension-0.0.1.sha256)"
          test "$first_sha" = "$second_sha"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium >/dev/null
      - name: Browser smoke — demo
        run: pnpm test:browser:demo
      - name: Browser smoke — extension
        run: pnpm test:browser:extension
      - run: pnpm smoke:packages
