name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium >/dev/null
      - name: Browser smoke — demo
        run: pnpm test:browser:demo
      - name: Browser smoke — extension
        run: pnpm test:browser:extension
      - name: Capture visual baseline candidates
        run: pnpm exec playwright test -c playwright.config.ts tests/browser/visual.capture.spec.ts
      - name: Upload visual baseline candidates
        uses: actions/upload-artifact@v4
        with:
          name: scrawlix-visual-baseline-candidates
          path: test-results/visual-candidates/*.png
          if-no-files-found: error
          retention-days: 7
      - run: pnpm smoke:packages
