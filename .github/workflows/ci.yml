name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Corpus behavior diff
        if: github.event_name == 'pull_request'
        run: pnpm corpus:diff -- "${{ github.event.pull_request.base.sha }}" HEAD
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Use Node 18 for published-runtime smoke
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Published runtime smoke — Node 18
        run: node scripts/smoke-node18-runtime.mjs
      - name: Restore Node 22 toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Core benchmark harness smoke
        run: pnpm bench:core:smoke >/dev/null
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium >/dev/null
      - name: Browser smoke — demo
        run: pnpm test:browser:demo
      - name: Browser smoke — extension
        run: pnpm test:browser:extension
      - run: pnpm smoke:packages
