name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium >/dev/null
      - name: Browser smoke — demo
        run: pnpm test:browser:demo
      - name: Browser smoke — extension
        run: pnpm test:browser:extension
      - name: Bootstrap context lab baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/graphite/context-specimen-lab'
        run: |
          pnpm exec playwright test -c playwright.config.ts tests/browser/visual.spec.ts --update-snapshots
          unexpected="$(git status --porcelain tests/browser/visual-baselines | grep -v '^?? tests/browser/visual-baselines/context-lab-desktop.png$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Existing visual baselines changed during context bootstrap:"
            echo "$unexpected"
            exit 1
          fi
          test -f tests/browser/visual-baselines/context-lab-desktop.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/visual-baselines/context-lab-desktop.png
          git commit -m "Add hostile-context visual baseline"
          git push
      - name: Browser visual regressions
        run: pnpm exec playwright test -c playwright.config.ts tests/browser/visual.spec.ts
      - name: Upload visual regression failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrawlix-visual-regression-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm smoke:packages
